<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- SEO -->
  <meta
    name="description"
    content="Kalasthali — Handpainted clothing crafted with art and individuality."
  >
  <link rel="canonical" href="https://kalasthali.co/">

  <!-- Social link previews. These are read by WhatsApp and other crawlers,
       unlike the PWA manifest metadata below. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Kalasthali By Nisha">
  <meta property="og:title" content="Kalasthali By Nisha">
  <meta
    property="og:description"
    content="Handpainted clothing crafted with art and individuality."
  >
  <meta property="og:url" content="https://kalasthali.co/">
  <meta property="og:image" content="https://kalasthali.co/assets/lib/assets/icon_logo.png">
  <meta property="og:image:secure_url" content="https://kalasthali.co/assets/lib/assets/icon_logo.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="2000">
  <meta property="og:image:height" content="2000">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Kalasthali By Nisha">
  <meta
    name="twitter:description"
    content="Handpainted clothing crafted with art and individuality."
  >
  <meta name="twitter:image" content="https://kalasthali.co/assets/lib/assets/icon_logo.png">

  <!-- PWA / Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kalasthali">

  <!-- Apple Touch Icon -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <!-- Favicons -->
  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon-32x32.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="favicon-16x16.png"
  >

  <link
    rel="shortcut icon"
    href="favicon.ico"
  >

  <!-- Page Title -->
  <title>Kalasthali</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --page: #e7e2d7;
      --header: #fef5e6;
      --surface: #ece7dd;
      --line: #d7cbb9;
      --accent: #a35710;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
    }

    #app-skeleton {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      background: var(--page);
      color: #5b351a;
      font-family: Georgia, serif;
      transition: opacity 180ms ease;
    }

    #app-skeleton.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .skeleton-header {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-sizing: border-box;
      background: var(--header);
      box-shadow: 0 4px 9px rgba(45, 30, 18, .25);
    }

    .skeleton-brand {
      font-size: clamp(28px, 3vw, 48px);
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .skeleton-nav {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .skeleton-pill {
      width: 130px;
      height: 42px;
      border-radius: 8px;
      background: #e7d0ae;
    }

    .skeleton-pill.short { width: 100px; }

    .skeleton-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 72px 54px;
      box-sizing: border-box;
    }

    .skeleton-title {
      width: 230px;
      height: 44px;
      margin-bottom: 22px;
      border-radius: 6px;
    }

    .skeleton-rule {
      width: 100%;
      height: 1px;
      margin-bottom: 34px;
      background: #b29e84;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 56px;
    }

    .skeleton-photo {
      min-height: 520px;
      border: 2px solid var(--line);
      border-radius: 18px;
    }

    .skeleton-copy {
      padding-top: 18px;
    }

    .skeleton-line {
      height: 18px;
      margin-bottom: 14px;
      border-radius: 6px;
    }

    .skeleton-line.heading { height: 52px; width: 84%; margin-bottom: 34px; }
    .skeleton-line.wide { width: 100%; }
    .skeleton-line.medium { width: 78%; }
    .skeleton-line.small { width: 53%; }
    .skeleton-panel { height: 136px; margin-top: 42px; border-radius: 20px; }

    .shimmer {
      background: linear-gradient(90deg, var(--surface) 25%, #f4eee4 45%, var(--surface) 65%);
      background-size: 400% 100%;
      animation: shimmer 1.25s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    @media (max-width: 800px) {
      .skeleton-header { height: 88px; padding: 0 20px; border-radius: 0 0 22px 22px; }
      .skeleton-brand { font-size: 25px; }
      .skeleton-nav .skeleton-pill { display: none; }
      .skeleton-nav::after { content: ''; width: 28px; height: 20px; border-top: 3px solid #1f1e25; border-bottom: 3px solid #1f1e25; }
      .skeleton-page { padding: 44px 22px; }
      .skeleton-title { width: 170px; height: 34px; margin-bottom: 18px; }
      .skeleton-grid { grid-template-columns: 1fr; gap: 28px; }
      .skeleton-photo { min-height: 380px; }
      .skeleton-copy { display: none; }
    }

    /* Responsive launch skeleton matching the product-page structure. */
    #app-skeleton {
      display: block;
      background: #ece7dd;
      min-height: 100dvh;
    }

    .launch-skeleton {
      box-sizing: border-box;
      width: 100%;
      min-height: 100dvh;
      padding: 41px 2.55vw 80px;
    }

    .launch-shape {
      border-radius: 22px;
      background: linear-gradient(105deg, #d4d4d4 25%, #eeeeee 45%, #d4d4d4 65%);
      background-size: 300% 100%;
      animation: launch-shine 1.45s ease-in-out infinite;
    }

    @keyframes launch-shine {
      0% { background-position: 100% 0; }
      100% { background-position: 0 0; }
    }

    .launch-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .launch-brand {
      width: 21.8%;
      height: 69px;
      border-radius: 10px;
    }

    .launch-actions {
      display: flex;
      gap: 11.3%;
      width: 57.1%;
      padding-top: 15px;
    }

    .launch-action-main { flex: 0 0 58.3%; height: 36px; border-radius: 9px; }
    .launch-action-small { flex: 1; height: 36px; border-radius: 9px; }

    .launch-content {
      display: block;
      margin-top: 65px;
    }

    .launch-media {
      width: 100%;
      aspect-ratio: 2.386;
      min-height: 0;
      border-radius: 10px;
    }

    .launch-line {
      height: 134px;
      border-radius: 22px;
    }

    .launch-bottom-copy {
      display: none;
    }

    .launch-desktop-copy, .launch-mobile-copy { display: none; }

    @media (max-width: 800px) {
      .launch-skeleton { padding: 31px 32px 72px; }
      .launch-brand {
        width: 100%;
        height: 107px;
        border-radius: 22px;
      }
      .launch-actions { display: none; }
      .launch-content {
        display: block;
        margin-top: 97px;
      }
      .launch-media {
        aspect-ratio: 1.1;
        min-height: 0;
        border-radius: 22px;
        width: calc(100% - 24px);
      }
      .launch-bottom-copy {
        display: block;
        width: calc(100% - 24px);
        margin-top: 49px;
      }
      .launch-line { height: 134px; }
    }
  </style>
</head>

<body>
  <div id="app-skeleton" aria-label="Loading Kalasthali">
    <div class="launch-skeleton">
      <header class="launch-header">
        <div class="launch-shape launch-brand"></div>
        <div class="launch-actions">
          <div class="launch-shape launch-action-main"></div>
          <div class="launch-shape launch-action-small"></div>
        </div>
      </header>
      <main class="launch-content">
        <div class="launch-shape launch-media"></div>
      </main>
      <div class="launch-bottom-copy">
        <div class="launch-shape launch-line"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var skeleton = document.getElementById('app-skeleton');
      if (!skeleton) return;
      skeleton.classList.add('is-hidden');
      window.setTimeout(function () { skeleton.remove(); }, 200);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
